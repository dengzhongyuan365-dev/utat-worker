[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utat-worker"
version = "0.1.0"
description = "Agentless AT/UT orchestrator and worker for Multica issues"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
utat = "utat.cli:main"
utat-node = "utat.node_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
